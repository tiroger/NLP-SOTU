name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "sotu/**", "data/**", "services/annotations/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify publication artifacts
        run: python -m sotu.verify_site
      - name: Verify annotation state and access isolation
        run: node --test tests/test_annotation_state.mjs services/annotations/tests/collection.test.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
