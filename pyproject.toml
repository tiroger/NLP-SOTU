[project]
name = "nlp-sotu"
version = "2.0.0"
description = "NLP analysis of every U.S. State of the Union address, published as a static site."
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "spacy>=3.8",
    "textstat>=0.7.4",
    "vaderSentiment>=3.3.2",
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5.6",
    "tqdm>=4.66",
    "en-core-web-sm",
    "altair>=6.3.0",
    "marimo>=0.25.2",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "jupyterlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sotu"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
